[workspace]
resolver = "2"
members = [
    "crates/telescope-core",
    "crates/telescope-cli",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "Apache-2.0 OR BSD-3-Clause"
repository = "https://github.com/Telescope-team/Telescope"

[workspace.dependencies]
arrow = { version = "60", default-features = false, features = ["csv"] }
arrow-array = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
noodles-bam = "0.87.0"
noodles-sam = "0.83.0"
noodles-bgzf = "0.46.0"
rayon = "1.10"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
