# Conda environment for the R engine of the differential-statistics layer.
#
#   mamba env create -f workflow/environment.yml
#   mamba activate telescope-ref
#   Rscript workflow/scripts/telescope_diff.R --help
#
# WHY THIS FILE EXISTS. The differential statistics are built on
# Bioconductor packages (DEXSeq, DESeq2, limma). Those are not part of the
# Rust binary, so the R engine needs its own environment.
#
# `telescope diff` NEEDS this environment: it aggregates in Rust and then
# runs `workflow/scripts/telescope_diff.R` as a subprocess, so the interpreter
# and the Bioconductor packages must be present. The Rust side of the binary
# needs none of it -- it is pure Rust with no C, no system libraries and no
# runtime package manager -- but the subcommand cannot compute any statistic
# without the engine.
#
# The same engine is also the independent second implementation the Rust
# side is checked against (`workflow/test_data/run_cli_agreement.sh`): the
# CLI hands it a pre-aggregated table, and it can also read the per-read
# parquets and aggregate for itself. Both paths must agree.
#
# VERSION PINNING. Every pin below is the exact build that produced the
# expected outputs in `workflow/test_data/results/`. One of them was NOT
# reproducible before this file existed: limma had been installed into the R
# library directly, so `conda list` did not know about it and
# `conda env export` would silently drop it. It is pinned here explicitly.
name: telescope-ref
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.3.3
  # Bioconductor: DEXSeq is the usage track, DESeq2 the gene track, limma the
  # variance moderation.
  - bioconductor-dexseq=1.48.0
  - bioconductor-deseq2=1.42.0
  - bioconductor-limma=3.58.1
  # I/O and reshaping.
  - r-arrow=21.0.0
  - r-dplyr=1.1.4
  - r-tidyr=1.3.1
  - r-optparse=1.7.5
  - r-matrixstats=1.5.0
  # The polyadenylation track's caller. LAPA is on neither bioconda nor
  # conda-forge -- it is a PyPI package. 0.0.5 is the version this track was
  # verified against.
  - pip
  - pip:
    - lapa==0.0.5
